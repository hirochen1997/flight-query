<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKYNET · 航班比价终端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #020510;
    --deep: #060d1f;
    --surface: rgba(8, 18, 40, 0.92);
    --surface-hover: rgba(12, 24, 52, 0.95);
    --border: rgba(0, 240, 255, 0.12);
    --border-active: rgba(0, 240, 255, 0.45);
    --cyan: #00f0ff;
    --cyan-dim: rgba(0, 240, 255, 0.6);
    --amber: #ff6b35;
    --amber-glow: rgba(255, 107, 53, 0.35);
    --purple: #b840ff;
    --green: #00e676;
    --red: #ff3d4f;
    --text: #b8c9e0;
    --text-bright: #e4eef8;
    --text-dim: #556885;
    --font-display: 'Orbitron', monospace;
    --font-mono: 'Share Tech Mono', monospace;
    --font-body: 'Noto Sans SC', -apple-system, sans-serif;
    --glow-cyan: 0 0 20px rgba(0,240,255,0.25), 0 0 60px rgba(0,240,255,0.08);
    --glow-amber: 0 0 20px rgba(255,107,53,0.3), 0 0 60px rgba(255,107,53,0.1);
    --glow-purple: 0 0 16px rgba(184,64,255,0.25);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: var(--font-body);
    background: var(--void);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ BACKGROUND LAYERS ============ */
  .bg-layer { position:fixed; inset:0; pointer-events:none; z-index:0; }

  .bg-hex {
    background-image:
      linear-gradient(rgba(0,240,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,0.025) 1px, transparent 1px);
    background-size: 80px 80px;
    animation: hexDrift 40s linear infinite;
  }
  @keyframes hexDrift {
    0% { background-position:0 0; }
    100% { background-position:80px 80px; }
  }

  .bg-scanlines {
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
  }

  .bg-vignette {
    background: radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(2,5,16,0.7) 100%);
  }

  .bg-noise {
    opacity: 0.015;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  canvas#particles { position:fixed; inset:0; z-index:0; pointer-events:none; }

  /* ============ LAYOUT ============ */
  .container { position:relative; z-index:1; max-width:1240px; margin:0 auto; padding:24px 20px; }

  /* ============ HEADER ============ */
  .header { text-align:center; padding:36px 0 24px; position:relative; }
  .header-line {
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:360px; height:1px;
    background: linear-gradient(90deg, transparent, var(--cyan-dim), var(--cyan), var(--cyan-dim), transparent);
  }
  .header-line::after {
    content:''; position:absolute; top:-2px; left:50%; transform:translateX(-50%);
    width:6px; height:6px; background:var(--cyan); border-radius:50%;
    box-shadow: 0 0 12px var(--cyan), 0 0 24px var(--cyan);
  }

  .logo {
    font-family: var(--font-display);
    font-size: 44px; font-weight: 900;
    letter-spacing: 6px;
    background: linear-gradient(180deg, #e0f8ff 0%, var(--cyan) 40%, #0088aa 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 28px rgba(0,240,255,0.4));
    position: relative;
    display: inline-block;
  }
  .logo::after {
    content: 'SKYNET QUERY';
    position: absolute; top: 0; left: 0; width: 100%;
    background: linear-gradient(180deg, transparent 0%, var(--cyan) 50%, transparent 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0.12;
    animation: glitchLine 3s ease-in-out infinite;
  }
  @keyframes glitchLine {
    0%, 90%, 100% { transform: translateX(0); }
    92% { transform: translateX(2px); opacity:0.18; }
    94% { transform: translateX(-1px); opacity:0.08; }
  }

  .subtitle {
    margin-top:10px; font-size:13px;
    font-family: var(--font-mono);
    color: var(--text-dim); letter-spacing:8px; font-weight:400;
  }
  .subtitle .ver {
    color: var(--cyan-dim); font-family: var(--font-display); font-size:10px; letter-spacing:2px;
  }

  /* ============ SOURCE STATUS PANEL (HUD) ============ */
  .hud-panel {
    display:flex; gap:10px; flex-wrap:wrap;
    margin: 20px 0 0;
    justify-content: center;
  }
  .hud-chip {
    display:flex; align-items:center; gap:8px;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-family: var(--font-mono);
    font-size: 12px;
    transition: all 0.35s ease;
    opacity: 0.5;
    filter: grayscale(0.5);
  }
  .hud-chip.active { opacity:1; filter:none; border-color: rgba(0,240,255,0.25); }
  .hud-chip.success { border-color: rgba(0,230,118,0.3); }
  .hud-chip.failed { border-color: rgba(255,61,79,0.25); opacity:0.6; }
  .hud-dot {
    width:7px; height:7px; border-radius:50%;
    background: var(--text-dim);
    transition: all 0.35s;
  }
  .hud-chip.active .hud-dot { background:var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: pulse 2s ease-in-out infinite; }
  .hud-chip.success .hud-dot { background:var(--green); box-shadow: 0 0 8px var(--green); }
  .hud-chip.failed .hud-dot { background:var(--red); }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .hud-chip-name { color:var(--text-dim); font-size:11px; }
  .hud-chip.active .hud-chip-name { color:var(--text-bright); }
  .hud-chip-count { color:var(--cyan); font-size:13px; font-weight:700; }
  .hud-chip.success .hud-chip-count { color:var(--green); }
  .hud-chip .hud-chip-status { font-size:10px; color:var(--text-dim); }

  /* ============ SEARCH PANEL ============ */
  .search-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px 30px;
    margin: 20px 0 24px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: var(--glow-cyan), inset 0 1px 0 rgba(0,240,255,0.04);
    transition: all 0.4s ease;
    position: relative;
  }
  .search-panel::before {
    content:''; position:absolute; top:-1px; left:30px; right:30px; height:1px;
    background: linear-gradient(90deg, transparent, rgba(0,240,255,0.2), transparent);
    border-radius: 1px;
  }
  .search-panel:focus-within {
    box-shadow: var(--glow-cyan), 0 0 48px rgba(0,240,255,0.1), inset 0 1px 0 rgba(0,240,255,0.06);
    border-color: var(--border-active);
  }

  .filter-grid {
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 16px;
  }

  .filter-group { display:flex; flex-direction:column; gap:6px; }
  .filter-group label {
    font-family: var(--font-mono);
    font-size:10px; font-weight:500; text-transform:uppercase;
    color: var(--text-dim); letter-spacing:2px;
  }
  .filter-group input,
  .filter-group select {
    background: rgba(4,10,24,0.85);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text-bright);
    font-size: 14px;
    font-family: var(--font-body);
    outline: none;
    transition: all 0.3s ease;
  }
  .filter-group input:focus,
  .filter-group select:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 14px rgba(0,240,255,0.12);
  }
  .filter-group input::placeholder { color: var(--text-dim); }
  .filter-group select option { background:#081228; color:var(--text-bright); }

  .input-with-suggestions { position:relative; }
  .suggestions {
    position:absolute; top:100%; left:0; right:0; z-index:100;
    background: rgba(4,10,26,0.98);
    border: 1px solid var(--border-active);
    border-top: none;
    border-radius: 0 0 10px 10px;
    max-height: 220px; overflow-y: auto;
    display: none;
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .suggestions.active { display:block; }
  .suggestion-item {
    padding: 10px 16px; cursor:pointer; font-size:13px;
    transition: background 0.15s;
    display:flex; justify-content:space-between; align-items:center;
  }
  .suggestion-item:hover, .suggestion-item.selected {
    background: rgba(0,240,255,0.08);
    color: var(--text-bright);
  }
  .suggestion-item .code {
    color: var(--cyan); font-family: var(--font-mono); font-size:11px;
    letter-spacing: 1px;
  }

  /* Toggle */
  .toggle-row { display:flex; align-items:center; gap:14px; padding-top:4px; }
  .toggle-label-text { font-size:13px; color:var(--text); font-family:var(--font-body); }
  .toggle { position:relative; width:48px; height:26px; cursor:pointer; }
  .toggle input { display:none; }
  .toggle .slider {
    position:absolute; inset:0;
    background: rgba(4,10,24,0.85); border:1px solid var(--border);
    border-radius:13px; transition:all 0.3s;
  }
  .toggle .slider::after {
    content:''; position:absolute;
    width:20px; height:20px; left:2px; top:2px;
    background: var(--text-dim); border-radius:50%; transition:all 0.3s;
  }
  .toggle input:checked + .slider {
    border-color: var(--cyan);
    box-shadow: 0 0 14px rgba(0,240,255,0.25);
  }
  .toggle input:checked + .slider::after {
    left:24px; background:var(--cyan);
    box-shadow: 0 0 10px rgba(0,240,255,0.5);
  }

  /* Counter */
  .passenger-row { display:flex; gap:24px; flex-wrap:wrap; align-items:center; }
  .counter { display:flex; align-items:center; gap:8px; }
  .counter .count-label { font-family:var(--font-mono); font-size:10px; color:var(--text-dim); min-width:24px; text-transform:uppercase; letter-spacing:1px; }
  .counter .count-value { font-family:var(--font-display); font-size:15px; font-weight:700; color:var(--cyan); min-width:22px; text-align:center; }
  .counter button {
    width:28px; height:28px; border-radius:50%;
    border:1px solid var(--border); background:rgba(4,10,24,0.85);
    color:var(--cyan-dim); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.2s; font-family:var(--font-mono);
  }
  .counter button:hover { border-color:var(--cyan); box-shadow:0 0 12px rgba(0,240,255,0.2); }
  .counter button:active { background:rgba(0,240,255,0.08); }

  /* Buttons */
  .btn-row { display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; }
  .btn {
    padding:12px 32px; border-radius:8px; border:none;
    font-size:14px; font-weight:600; cursor:pointer;
    font-family:var(--font-display); letter-spacing:2px;
    transition:all 0.3s ease; position:relative; overflow:hidden;
    text-transform:uppercase;
  }
  .btn-primary {
    background: linear-gradient(135deg, #00a0cc, #006688);
    color: #e0f8ff;
    box-shadow: 0 0 20px rgba(0,200,255,0.2);
    flex:1; min-width:200px;
    border: 1px solid rgba(0,240,255,0.25);
  }
  .btn-primary:hover {
    box-shadow: 0 0 32px rgba(0,200,255,0.35), 0 4px 16px rgba(0,200,255,0.15);
    transform: translateY(-1px);
    background: linear-gradient(135deg, #00b8e0, #007799);
  }
  .btn-primary:active { transform:translateY(0); }
  .btn-primary:disabled { opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-secondary {
    background: transparent; border:1px solid var(--border);
    color: var(--text-bright);
  }
  .btn-secondary:hover { border-color:var(--cyan); box-shadow:0 0 12px rgba(0,240,255,0.08); }

  .btn .spinner {
    display:none; width:16px; height:16px; border:2px solid rgba(224,248,255,0.25);
    border-top-color:#e0f8ff; border-radius:50%; animation:spin 0.6s linear infinite;
    margin-right:8px; vertical-align:middle;
  }
  .btn.loading .spinner { display:inline-block; }
  @keyframes spin { to{transform:rotate(360deg);} }

  /* ============ RESULTS ============ */
  .results-toolbar {
    display:flex; justify-content:space-between; align-items:center;
    margin: 24px 0 16px; flex-wrap:wrap; gap:12px;
  }
  .results-count {
    font-family: var(--font-mono); font-size:13px;
    color: var(--cyan-dim); letter-spacing:1px;
  }
  .results-count strong { color:var(--cyan); font-family:var(--font-display); }
  .sort-row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .sort-label { font-size:10px; color:var(--text-dim); font-family:var(--font-mono); letter-spacing:2px; text-transform:uppercase; margin-right:4px; }
  .sort-btn {
    padding:5px 12px; border-radius:16px; border:1px solid var(--border);
    background:transparent; color:var(--text-dim); cursor:pointer;
    font-size:11px; font-family:var(--font-mono);
    transition:all 0.2s; letter-spacing:0.5px;
  }
  .sort-btn.active {
    background:rgba(0,240,255,0.08); border-color:var(--cyan);
    color:var(--cyan); box-shadow:0 0 8px rgba(0,240,255,0.1);
  }
  .sort-btn:hover { border-color:var(--cyan); color:var(--text-bright); }

  .results-grid { display:flex; flex-direction:column; gap:10px; }

  /* ============ FLIGHT CARD ============ */
  .flight-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 26px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: all 0.35s cubic-bezier(0.25,0.8,0.25,1.2);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    animation: cardIn 0.5s ease both;
  }
  .flight-card:nth-child(1) { animation-delay: 0.05s; }
  .flight-card:nth-child(2) { animation-delay: 0.1s; }
  .flight-card:nth-child(3) { animation-delay: 0.15s; }
  .flight-card:nth-child(4) { animation-delay: 0.2s; }
  .flight-card:nth-child(5) { animation-delay: 0.25s; }
  @keyframes cardIn {
    from { opacity:0; transform:translateY(16px); }
    to { opacity:1; transform:translateY(0); }
  }

  .flight-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background: linear-gradient(90deg, transparent, rgba(0,240,255,0.15), transparent);
    opacity:0; transition:opacity 0.35s;
  }
  .flight-card:hover::before { opacity:1; }
  .flight-card:hover {
    border-color: var(--border-active);
    box-shadow: 0 0 28px rgba(0,240,255,0.06), 0 8px 24px rgba(0,0,0,0.3);
    transform: translateY(-2px);
    background: var(--surface-hover);
  }
  .flight-card::after {
    content:''; position:absolute; top:0; left:0; width:100%; height:100%;
    background: linear-gradient(180deg, transparent 60%, rgba(0,240,255,0.015) 100%);
    pointer-events:none;
  }

  .flight-card-header {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:14px; flex-wrap:wrap; gap:14px;
    position:relative; z-index:1;
  }
  .airline-info { display:flex; align-items:center; gap:10px; }
  .airline-icon {
    width:36px; height:36px; border-radius:8px;
    background: rgba(0,240,255,0.06); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-size:14px; color:var(--cyan-dim);
    flex-shrink:0;
  }
  .airline-name { font-weight:600; color:var(--text-bright); font-size:14px; }
  .flight-number { font-family:var(--font-mono); font-size:11px; color:var(--text-dim); letter-spacing:1px; }

  .flight-route { display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:center; flex:1; min-width:280px; }
  .flight-city { text-align:center; min-width:72px; }
  .flight-time { font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--text-bright); letter-spacing:1px; }
  .flight-airport { font-family:var(--font-mono); font-size:10px; color:var(--text-dim); margin-top:2px; letter-spacing:1px; }

  .flight-path {
    flex:1; min-width:100px; position:relative; text-align:center;
  }
  .flight-path-line {
    height:1.5px; background: linear-gradient(90deg, var(--cyan-dim), var(--cyan), var(--purple));
    position:relative; margin:8px 0;
    border-radius: 1px;
  }
  .flight-path-line::after {
    content:''; position:absolute; right:-5px; top:-4px;
    width:0; height:0;
    border-left:8px solid var(--purple);
    border-top:5px solid transparent;
    border-bottom:5px solid transparent;
  }
  .flight-duration { font-family:var(--font-mono); font-size:10px; color:var(--text-dim); letter-spacing:1px; }
  .flight-stops {
    font-family:var(--font-mono); font-size:10px; letter-spacing:1px;
    margin-top:2px;
  }

  .flight-price { text-align:right; min-width:100px; position:relative; z-index:1; }
  .price-amount {
    font-family: var(--font-display); font-size:28px; font-weight:900;
    color: var(--amber);
    text-shadow: 0 0 20px var(--amber-glow);
    letter-spacing: 1px;
  }
  .price-label { font-family:var(--font-mono); font-size:10px; color:var(--text-dim); letter-spacing:1px; }

  /* Best price glow */
  .flight-card:has(.best-price) { border-left: 2px solid rgba(255,107,53,0.3); }

  .expand-hint {
    font-family:var(--font-mono); font-size:10px; color:var(--text-dim);
    text-align:center; margin-top:6px; letter-spacing:2px;
    position:relative; z-index:1;
  }

  /* ============ EXPANDED DETAILS ============ */
  .flight-details {
    margin-top:16px; padding-top:16px;
    border-top: 1px solid var(--border);
    display:none; position:relative; z-index:1;
    animation: expandIn 0.35s ease;
  }
  @keyframes expandIn { from{opacity:0;transform:translateY(-8px);} to{opacity:1;transform:translateY(0);} }
  .flight-card.expanded .flight-details { display:block; }

  .segment-list { display:flex; flex-direction:column; gap:10px; }
  .segment-item {
    display:flex; align-items:center; gap:14px;
    padding:10px 14px; background: rgba(0,240,255,0.02);
    border-radius:8px; flex-wrap:wrap; font-size:13px;
    border: 1px solid rgba(0,240,255,0.04);
  }
  .segment-time { font-family:var(--font-mono); color:var(--text-bright); min-width:150px; font-size:12px; letter-spacing:0.5px; }
  .segment-info { color:var(--text-dim); flex:1; font-size:12px; }
  .layover-badge {
    padding:3px 10px; border-radius:12px;
    background: rgba(184,64,255,0.1); color:var(--purple);
    font-family:var(--font-mono); font-size:10px; text-align:center; margin:4px 0;
    border: 1px solid rgba(184,64,255,0.15);
    letter-spacing:1px;
  }

  /* ============ PLATFORM PRICE COMPARISON ============ */
  .platform-section { margin-top:16px; }
  .platform-section-title {
    font-family: var(--font-mono); font-size:11px; color:var(--text-dim);
    margin-bottom:10px; letter-spacing:2px; text-transform:uppercase;
  }
  .platform-grid { display:flex; gap:10px; flex-wrap:wrap; }
  .platform-price-chip {
    padding: 10px 16px; border-radius:10px;
    border: 1px solid var(--border);
    background: rgba(6,14,30,0.7);
    font-size:12px; text-align:center; min-width:100px;
    transition: all 0.25s ease;
    position: relative;
  }
  .platform-price-chip:hover {
    border-color: var(--border-active);
    background: rgba(0,240,255,0.04);
  }
  .platform-price-chip.best-price {
    border-color: rgba(255,107,53,0.4);
    background: rgba(255,107,53,0.08);
    box-shadow: 0 0 20px rgba(255,107,53,0.12);
  }
  .platform-price-chip .chip-platform {
    font-family:var(--font-mono); font-size:10px; color:var(--text-dim);
    letter-spacing:1px; margin-bottom:3px;
  }
  .platform-price-chip.best-price .chip-platform { color:var(--amber); font-weight:600; }
  .platform-price-chip .chip-price {
    font-family:var(--font-display); font-size:18px; font-weight:700;
    color:var(--text-bright);
  }
  .platform-price-chip.best-price .chip-price { color:var(--amber); }
  .platform-price-chip .chip-badge {
    font-family:var(--font-mono); font-size:9px; color:var(--amber);
    margin-top:2px; letter-spacing:1px;
  }

  /* Booking links */
  .booking-links { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .btn-buy {
    display:inline-flex; align-items:center; gap:8px;
    padding: 10px 22px; border-radius:8px;
    border: 1px solid rgba(255,107,53,0.4);
    background: rgba(255,107,53,0.08);
    font-family: var(--font-display); font-size:12px; font-weight:600;
    color: var(--amber); text-decoration:none;
    transition:all 0.25s; letter-spacing:1px;
    box-shadow: 0 0 16px rgba(255,107,53,0.1);
  }
  .btn-buy:hover {
    border-color:var(--amber);
    background: rgba(255,107,53,0.15);
    box-shadow: 0 0 24px rgba(255,107,53,0.2);
    transform: translateY(-1px);
  }
  .btn-buy-secondary {
    border-color: var(--border);
    background: transparent;
    color: var(--text-dim);
    box-shadow: none;
    font-size:11px; padding:8px 16px;
  }
  .btn-buy-secondary:hover {
    border-color: var(--cyan);
    color: var(--text-bright);
    box-shadow: 0 0 12px rgba(0,240,255,0.08);
  }

  /* ============ STATE PANELS ============ */
  .empty-state, .error-state {
    text-align:center; padding:60px 20px;
    background: var(--surface); border:1px solid var(--border);
    border-radius:12px;
  }
  .state-icon { font-size:44px; margin-bottom:14px; }
  .state-title { font-family:var(--font-display); font-size:16px; color:var(--text-bright); margin-bottom:6px; letter-spacing:2px; }
  .state-desc { font-family:var(--font-mono); font-size:12px; color:var(--text-dim); letter-spacing:1px; }

  .warning-banner {
    background: rgba(255,107,53,0.06); border:1px solid rgba(255,107,53,0.2);
    border-radius:8px; padding:12px 16px; margin-bottom:14px;
    font-family:var(--font-mono); font-size:11px; color:var(--amber);
    display:flex; align-items:flex-start; gap:8px; letter-spacing:0.5px;
  }

  .file-warning {
    display:none; text-align:center; padding:24px;
    background: rgba(255,61,79,0.08); border:1px solid rgba(255,61,79,0.25);
    border-radius:12px; margin-bottom:24px;
  }
  .file-warning code {
    background:rgba(0,240,255,0.1); padding:6px 16px; border-radius:6px;
    font-family:var(--font-mono); font-size:14px; color:var(--cyan);
    display:inline-block; margin:8px 0;
  }

  /* ============ SCROLLBAR ============ */
  ::-webkit-scrollbar { width:5px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:rgba(0,240,255,0.12); border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(0,240,255,0.25); }

  /* Date picker */
  input[type="date"] { color-scheme:dark; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter:invert(0.8) hue-rotate(180deg); cursor:pointer; }

  /* ============ RESPONSIVE ============ */
  @media (max-width:768px) {
    .logo { font-size:30px; letter-spacing:3px; }
    .filter-grid { grid-template-columns:1fr 1fr; }
    .flight-time { font-size:17px; }
    .price-amount { font-size:22px; }
    .flight-route { gap:8px; min-width:auto; }
    .header-line { width:200px; }
    .hud-panel { gap:6px; }
    .hud-chip { padding:6px 12px; font-size:10px; }
  }
  @media (max-width:480px) {
    .filter-grid { grid-template-columns:1fr; }
    .container { padding:12px; }
    .search-panel { padding:18px 14px; }
    .btn-row { flex-direction:column; }
    .flight-card { padding:16px; }
    .flight-route { gap:6px; }
    .results-toolbar { flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>

<div class="bg-layer bg-hex"></div>
<div class="bg-layer bg-scanlines"></div>
<div class="bg-layer bg-vignette"></div>
<div class="bg-layer bg-noise"></div>
<canvas id="particles"></canvas>

<div class="container">
  <!-- HEADER -->
  <header class="header">
    <div class="logo">SKYNET QUERY</div>
    <div class="subtitle">智 能 航 班 比 价 终 端 <span class="ver">v3.2</span></div>
    <div class="header-line"></div>
  </header>

  <!-- SOURCE STATUS HUD -->
  <div class="hud-panel" id="hudPanel">
    <div class="hud-chip" id="hud-fliggy">
      <span class="hud-dot"></span>
      <span class="hud-chip-name">飞猪</span>
      <span class="hud-chip-status">待机</span>
    </div>
    <div class="hud-chip" id="hud-ctrip">
      <span class="hud-dot"></span>
      <span class="hud-chip-name">携程</span>
      <span class="hud-chip-status">待机</span>
    </div>
    <div class="hud-chip" id="hud-qunar">
      <span class="hud-dot"></span>
      <span class="hud-chip-name">去哪儿</span>
      <span class="hud-chip-status">待接入</span>
    </div>
    <div class="hud-chip" id="hud-tongcheng">
      <span class="hud-dot"></span>
      <span class="hud-chip-name">同程旅行</span>
      <span class="hud-chip-status">待接入</span>
    </div>
  </div>

  <!-- FILE PROTOCOL WARNING -->
  <div class="file-warning" id="fileWarn">
    <div class="state-icon">!!</div>
    <div class="state-title">请通过服务器访问</div>
    <div class="state-desc" style="margin-top:4px;">在浏览器地址栏输入：</div>
    <code>http://localhost:3000</code>
    <div class="state-desc" style="margin-top:6px;">当前：<span id="curUrl" style="color:var(--red)"></span></div>
  </div>

  <!-- SEARCH PANEL -->
  <div class="search-panel" id="searchPanel">
    <div class="filter-grid">
      <div class="filter-group">
        <label>出发城市 *</label>
        <div class="input-with-suggestions" id="originWrapper">
          <input type="text" id="origin" placeholder="例: 北京、上海、PEK" autocomplete="off">
          <div class="suggestions" id="originSuggestions"></div>
        </div>
      </div>
      <div class="filter-group">
        <label>到达城市 *</label>
        <div class="input-with-suggestions" id="destWrapper">
          <input type="text" id="destination" placeholder="例: 三亚、上海、SYX" autocomplete="off">
          <div class="suggestions" id="destSuggestions"></div>
        </div>
      </div>
      <div class="filter-group">
        <label>出发日期 *</label>
        <input type="date" id="departureDate">
      </div>
      <div class="filter-group">
        <label>舱位等级</label>
        <select id="travelClass">
          <option value="">全部舱位</option>
          <option value="ECONOMY">经济舱</option>
          <option value="PREMIUM_ECONOMY">超级经济舱</option>
          <option value="BUSINESS">商务舱</option>
          <option value="FIRST">头等舱</option>
        </select>
      </div>
      <div class="filter-group">
        <label>航空公司偏好</label>
        <select id="airlines">
          <option value="">全部航司</option>
          <option value="CA">中国国航 (CA)</option>
          <option value="MU">东方航空 (MU)</option>
          <option value="CZ">南方航空 (CZ)</option>
          <option value="HU">海南航空 (HU)</option>
          <option value="3U">四川航空 (3U)</option>
          <option value="ZH">深圳航空 (ZH)</option>
          <option value="MF">厦门航空 (MF)</option>
          <option value="GS">天津航空 (GS)</option>
          <option value="SC">山东航空 (SC)</option>
        </select>
      </div>
      <div class="filter-group">
        <label>最高价格 (元)</label>
        <input type="number" id="maxPrice" placeholder="不限" min="0" step="100">
      </div>
      <div class="filter-group">
        <label>最大结果数</label>
        <select id="maxResults">
          <option value="10">10 条</option>
          <option value="20" selected>20 条</option>
          <option value="30">30 条</option>
          <option value="50">50 条</option>
        </select>
      </div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:32px;margin-top:16px;align-items:center">
      <div class="passenger-row">
        <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase">乘客</span>
        <div class="counter">
          <span class="count-label">成人</span>
          <button onclick="adjustCount('adults',-1)">-</button>
          <span class="count-value" id="adultsCount">1</span>
          <button onclick="adjustCount('adults',1)">+</button>
        </div>
        <div class="counter">
          <span class="count-label">儿童</span>
          <button onclick="adjustCount('children',-1)">-</button>
          <span class="count-value" id="childrenCount">0</span>
          <button onclick="adjustCount('children',1)">+</button>
        </div>
        <div class="counter">
          <span class="count-label">婴儿</span>
          <button onclick="adjustCount('infants',-1)">-</button>
          <span class="count-value" id="infantsCount">0</span>
          <button onclick="adjustCount('infants',1)">+</button>
        </div>
      </div>
      <div class="toggle-row">
        <label class="toggle">
          <input type="checkbox" id="nonStop">
          <span class="slider"></span>
        </label>
        <span class="toggle-label-text">仅直飞</span>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="searchBtn" onclick="searchFlights()">
        <span class="spinner"></span> 搜索航班
      </button>
      <button class="btn btn-secondary" onclick="clearFilters()">重置条件</button>
    </div>
  </div>

  <!-- RESULTS AREA -->
  <div id="resultsArea" style="display:none">
    <div class="results-toolbar">
      <div class="results-count" id="resultsCount"></div>
      <div class="sort-row">
        <span class="sort-label">排序:</span>
        <button class="sort-btn" data-sort="price" onclick="setSort('price')">价格 ↑</button>
        <button class="sort-btn" data-sort="price-desc" onclick="setSort('price-desc')">价格 ↓</button>
        <button class="sort-btn" data-sort="departure" onclick="setSort('departure')">出发 ↑</button>
        <button class="sort-btn" data-sort="departure-desc" onclick="setSort('departure-desc')">出发 ↓</button>
        <button class="sort-btn" data-sort="duration" onclick="setSort('duration')">时长 ↑</button>
        <button class="sort-btn" data-sort="stops" onclick="setSort('stops')">中转 ↑</button>
      </div>
    </div>
    <div class="results-grid" id="resultsGrid"></div>
  </div>

  <!-- INITIAL STATE -->
  <div id="stateArea">
    <div class="empty-state">
      <div class="state-icon">&#9787;</div>
      <div class="state-title">输入搜索条件</div>
      <div class="state-desc">选择出发地、目的地和日期后开始搜索</div>
    </div>
  </div>
</div>

<script>
// ============ STATE ============
let allFlights = [];
let currentSort = 'price';
let passengers = { adults:1, children:0, infants:0 };

// ============ INIT ============
(function initApp() {
  if (window.location.protocol === 'file:') {
    const w = document.getElementById('fileWarn');
    if (w) { w.style.display = 'block'; }
    const cu = document.getElementById('curUrl');
    if (cu) { cu.textContent = window.location.href; }
    document.getElementById('searchPanel').style.opacity = '0.4';
    document.getElementById('searchPanel').style.pointerEvents = 'none';
    return;
  }
  initDate();
  checkHealth();
  initParticles();
  initAutocomplete('origin', 'originSuggestions');
  initAutocomplete('destination', 'destSuggestions');
  document.addEventListener('click', e => {
    if (!e.target.closest('.input-with-suggestions')) {
      document.querySelectorAll('.suggestions').forEach(s => s.classList.remove('active'));
    }
  });
})();

function initDate() {
  const today = new Date().toISOString().split('T')[0];
  const nextWeek = new Date(Date.now() + 7*86400000).toISOString().split('T')[0];
  const dp = document.getElementById('departureDate');
  dp.setAttribute('min', today);
  dp.value = nextWeek;
}

// ============ HEALTH CHECK ============
async function checkHealth() {
  try {
    const res = await fetch('/api/health');
    const data = await res.json();
    if (data.sources) {
      data.sources.forEach(s => {
        const chip = document.getElementById('hud-' + s.id);
        if (chip) {
          chip.classList.add('active');
          chip.querySelector('.hud-chip-status').textContent = s.available ? '就绪' : '离线';
          if (s.available) chip.classList.add('success');
        }
      });
    }
  } catch {}
}

// ============ PASSENGER COUNTER ============
function adjustCount(field, delta) {
  const newVal = passengers[field] + delta;
  if (newVal < 0) return;
  if (field === 'adults' && newVal < 1) return;
  if (field === 'infants' && newVal > passengers.adults) return;
  passengers[field] = newVal;
  document.getElementById(field + 'Count').textContent = newVal;
}

// ============ AUTOCOMPLETE ============
let debounceTimers = {};
function initAutocomplete(inputId, suggestionsId) {
  const input = document.getElementById(inputId);
  const suggestions = document.getElementById(suggestionsId);
  if (!input || !suggestions) return;
  let selectedIdx = -1;

  input.addEventListener('input', () => {
    clearTimeout(debounceTimers[inputId]);
    const val = input.value.trim();
    if (!val) { suggestions.classList.remove('active'); return; }
    debounceTimers[inputId] = setTimeout(async () => {
      try {
        const res = await fetch(`/api/airports?q=${encodeURIComponent(val)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        selectedIdx = -1;
        suggestions.innerHTML = data.length === 0
          ? '<div class="suggestion-item" style="color:var(--text-dim)">未找到匹配城市</div>'
          : data.map((a, i) =>
              `<div class="suggestion-item" data-idx="${i}" data-code="${a.code}" data-name="${a.name}">
                <span>${a.name}</span><span class="code">${a.code}</span>
              </div>`).join('');
        suggestions.classList.add('active');
      } catch(err) { console.error('Autocomplete error:', err); }
    }, 180);
  });

  input.addEventListener('keydown', e => {
    const items = suggestions.querySelectorAll('.suggestion-item[data-code]');
    if (!suggestions.classList.contains('active') || items.length === 0) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selectedIdx = Math.min(selectedIdx + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('selected', i === selectedIdx));
      items[selectedIdx]?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      selectedIdx = Math.max(selectedIdx - 1, -1);
      items.forEach((el, i) => el.classList.toggle('selected', i === selectedIdx));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (selectedIdx >= 0 && items[selectedIdx]) selectSuggestion(input, items[selectedIdx], suggestions);
    } else if (e.key === 'Escape') {
      suggestions.classList.remove('active');
    }
  });

  suggestions.addEventListener('click', e => {
    const item = e.target.closest('.suggestion-item');
    if (item?.dataset.code) selectSuggestion(input, item, suggestions);
  });
}

function selectSuggestion(input, item, suggestions) {
  input.value = `${item.dataset.name} (${item.dataset.code})`;
  input.dataset.code = item.dataset.code;
  suggestions.classList.remove('active');
}

// ============ HUD UPDATE ============
function updateHud(sourceResults) {
  if (!sourceResults) return;
  sourceResults.forEach(s => {
    const chip = document.getElementById('hud-' + s.id);
    if (!chip) return;
    chip.classList.add('active');
    chip.classList.remove('success', 'failed');
    const statusEl = chip.querySelector('.hud-chip-status');
    if (s.success === false) {
      chip.classList.add('failed');
      if (statusEl) statusEl.textContent = '失败';
    } else if (s.count > 0) {
      chip.classList.add('success');
      if (statusEl) statusEl.textContent = s.count + ' 条结果';
    } else {
      if (statusEl) statusEl.textContent = '0 结果';
    }
  });
}

// ============ SEARCH ============
async function searchFlights() {
  const originInput = document.getElementById('origin').value.trim();
  const destInput = document.getElementById('destination').value.trim();
  const departureDate = document.getElementById('departureDate').value;
  const travelClass = document.getElementById('travelClass').value;
  const airlines = document.getElementById('airlines').value;
  const maxPrice = document.getElementById('maxPrice').value;
  const nonStop = document.getElementById('nonStop').checked;
  const maxResults = parseInt(document.getElementById('maxResults').value);

  if (!originInput || !destInput || !departureDate) {
    showError('请填写出发城市、到达城市和出发日期');
    return;
  }

  const btn = document.getElementById('searchBtn');
  btn.classList.add('loading'); btn.disabled = true;
  document.getElementById('resultsArea').style.display = 'none';
  document.getElementById('stateArea').innerHTML = '';

  // Reset HUD
  document.querySelectorAll('.hud-chip').forEach(c => {
    c.classList.remove('active','success','failed');
    c.querySelector('.hud-chip-status').textContent = '搜索中...';
    c.querySelector('.hud-dot')?.classList.add('pulse');
  });

  try {
    const body = {
      origin: originInput, destination: destInput, departureDate,
      adults: passengers.adults, children: passengers.children, infants: passengers.infants,
      nonStop, maxResults,
    };
    if (travelClass) body.travelClass = travelClass;
    if (airlines) body.airlines = airlines;
    if (maxPrice) body.maxPrice = parseInt(maxPrice);

    const res = await fetch('/api/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      let errMsg = `请求失败 (HTTP ${res.status})`;
      try { const d = await res.json(); if (d.error) errMsg = d.error; } catch {}
      showError(errMsg);
      return;
    }

    const data = await res.json();
    allFlights = data.flights || [];

    // Update HUD with source status
    if (data.meta?.allSources) updateHud(data.meta.allSources);

    if (allFlights.length === 0) {
      document.getElementById('stateArea').innerHTML = `
        <div class="empty-state">
          <div class="state-icon">&#9744;</div>
          <div class="state-title">未找到航班</div>
          <div class="state-desc">尝试扩大搜索范围，或调整日期/目的地</div>
        </div>`;
    } else {
      document.getElementById('resultsArea').style.display = 'block';
      document.getElementById('stateArea').innerHTML = '';
      applySort();
      renderFlights();
    }
  } catch (err) {
    showError(`网络错误: ${err.message}`);
    document.querySelectorAll('.hud-chip').forEach(c => {
      c.querySelector('.hud-chip-status').textContent = '错误';
    });
  } finally {
    btn.classList.remove('loading'); btn.disabled = false;
  }
}

function showError(msg) {
  document.getElementById('stateArea').innerHTML = `
    <div class="error-state">
      <div class="state-icon">!!</div>
      <div class="state-title">搜索异常</div>
      <div class="state-desc">${msg}</div>
    </div>`;
}

// ============ SORTING ============
function setSort(type) {
  currentSort = type;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === type));
  applySort();
  renderFlights();
}

function applySort() {
  const sorters = {
    'price': (a,b) => a.price.amount - b.price.amount,
    'price-desc': (a,b) => b.price.amount - a.price.amount,
    'departure': (a,b) => new Date(a.departureTime) - new Date(b.departureTime),
    'departure-desc': (a,b) => new Date(b.departureTime) - new Date(a.departureTime),
    'duration': (a,b) => (a.stops*1000+parseDur(a.duration)) - (b.stops*1000+parseDur(b.duration)),
    'stops': (a,b) => a.stops - b.stops || a.price.amount - b.price.amount,
  };
  allFlights.sort(sorters[currentSort] || sorters['price']);
}

function parseDur(d) {
  const h = d.match(/(\d+)h/), m = d.match(/(\d+)m/);
  return (h?parseInt(h[1])*60:0) + (m?parseInt(m[1]):0);
}

// ============ RENDER ============
function renderFlights() {
  const sortLabels = { price:'价格↑','price-desc':'价格↓',departure:'出发↑','departure-desc':'出发↓',duration:'时长↑',stops:'中转↑'};
  document.getElementById('resultsCount').innerHTML =
    `<strong>[${allFlights.length}]</strong> 个航班 &nbsp;&#9500;&nbsp; ${sortLabels[currentSort]||''}`;

  const grid = document.getElementById('resultsGrid');
  grid.innerHTML = allFlights.map((f, i) => `
    <div class="flight-card${f.bestPricePlatform ? ' best-price' : ''}" id="card-${i}" onclick="toggleCard(${i})">
      <div class="flight-card-header">
        <div class="airline-info">
          <div class="airline-icon">${(f.carrierCodes[0]||'?').slice(0,2)}</div>
          <div>
            <div class="airline-name">${f.carrierNames.join(', ')}</div>
            <div class="flight-number">${f.segments.map(s=>s.flightNumber).join(' / ')}</div>
          </div>
        </div>
        <div class="flight-route">
          <div class="flight-city">
            <div class="flight-time">${fmtTime(f.departureTime)}</div>
            <div class="flight-airport">${f.segments[0].departure.iata}</div>
          </div>
          <div class="flight-path">
            <div class="flight-path-line"></div>
            <div class="flight-duration">${f.duration.replace('h','h ')}</div>
            <div class="flight-stops" style="color:${f.stops>0?'var(--purple)':'var(--green)'}">
              ${f.stops>0 ? f.stops+' 中转 · '+f.stopIatas.join(' → ') : '直飞'}
            </div>
          </div>
          <div class="flight-city">
            <div class="flight-time">${fmtTime(f.arrivalTime)}</div>
            <div class="flight-airport">${f.segments[f.segments.length-1].arrival.iata}</div>
          </div>
        </div>
        <div class="flight-price">
          <div class="price-amount">${f.price.formatted}</div>
          <div class="price-label">${f.bestPricePlatform ? (f.platformLabels[f.bestPricePlatform]||'')+' 最低价' : ''}</div>
        </div>
      </div>
      <div class="expand-hint">&#9660; 点击展开 · 多平台比价</div>
      <div class="flight-details">
        <div class="segment-list">
          ${f.segments.map((seg,si) => `
            <div class="segment-item">
              <div class="segment-time">${fmtDT(seg.departure.time)} &#10132; ${fmtDT(seg.arrival.time)}</div>
              <div class="segment-info">${seg.carrierName} · ${seg.flightNumber} · ${seg.aircraft}${seg.numberOfStops>0?' · 经停'+seg.numberOfStops+'站':''}</div>
            </div>
            ${si < f.segments.length-1 ? `<div class="layover-badge">&#9201; 中转等待 · ${f.stopIatas[si]}</div>` : ''}
          `).join('')}
        </div>
        ${f.platformCount > 0 ? `
        <div class="platform-section">
          <div class="platform-section-title">&#9670; 多平台价格对比 (${f.platformCount} 个平台)</div>
          <div class="platform-grid">
            ${f.platformPrices.map(p => `
              <div class="platform-price-chip${p.isBest?' best-price':''}">
                <div class="chip-platform">${f.platformLabels[p.platform]||p.platform}</div>
                <div class="chip-price">${p.formatted}</div>
                ${p.isBest?'<div class="chip-badge">&#9733; 最低价</div>':''}
              </div>
            `).join('')}
          </div>
          <div class="booking-links">
            ${f.bookingLink ? `
              <a href="${esc(f.bookingLink)}" target="_blank" class="btn-buy" onclick="event.stopPropagation()">
                &#9654; 立即购票 (${f.platformLabels[f.bestPricePlatform]||'飞猪'})
              </a>` : ''}
            ${(f.searchLinks||[]).map(l => `
              <a href="${esc(l.url)}" target="_blank" class="btn-buy btn-buy-secondary" onclick="event.stopPropagation()">
                ${l.isDirectBook?'&#9654;':'&#8981;'} ${esc(l.name)}${l.isDirectBook?' 直接购票':(l.isTargetedSearch?' 指定搜索':' 搜索比价')}
              </a>
            `).join('')}
          </div>
        </div>` : ''}
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === currentSort));
}

function toggleCard(idx) {
  document.getElementById(`card-${idx}`).classList.toggle('expanded');
}

function fmtTime(iso) { const d=new Date(iso); return d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}); }
function fmtDT(iso) { const d=new Date(iso); return d.toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}); }
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// ============ PARTICLES ============
function initParticles() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let animId;

  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  function create() {
    particles = [];
    const count = Math.floor((canvas.width * canvas.height) / 13000);
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random()*canvas.width, y: Math.random()*canvas.height,
        r: Math.random()*1.8+0.4,
        vx: (Math.random()-0.5)*0.25, vy: (Math.random()-0.5)*0.25,
        alpha: Math.random()*0.5+0.08,
      });
    }
  }
  create(); window.addEventListener('resize', create);

  function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if(p.x<0)p.x=canvas.width; if(p.x>canvas.width)p.x=0;
      if(p.y<0)p.y=canvas.height; if(p.y>canvas.height)p.y=0;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(0,240,255,${p.alpha})`; ctx.fill();
    });
    for (let i=0; i<particles.length; i++) {
      for (let j=i+1; j<particles.length; j++) {
        const dx = particles[i].x-particles[j].x, dy = particles[i].y-particles[j].y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist<130) {
          ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(0,240,255,${0.04*(1-dist/130)})`; ctx.stroke();
        }
      }
    }
    animId = requestAnimationFrame(animate);
  }
  animate();
}
</script>
