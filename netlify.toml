[build]
  publish = "public/"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Route API calls to Netlify Function (Node.js Fliggy — no Python needed)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
